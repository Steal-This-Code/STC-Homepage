name: Nightly Neighborhood Watch Data Build

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neighborhood-watch-data
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::dplyr
            any::fs
            any::jsonlite
            any::lubridate
            any::readr
            any::sf
            any::stringr
            any::tibble
            any::tidyr
            any::purrr
            github::Steal-This-Code/tidycops

      - name: Build Neighborhood Watch data
        run: Rscript scripts/build_neighborhood_watch_data.R

      - name: Commit updated data artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Nightly Neighborhood Watch data refresh"
          file_pattern: "data/neighborhood-watch/*"
